name: DevOps CI Pipeline


# ဘယ်အချိန်မှာ အလုပ်လုပ်မလဲ when will it work? - ကုဒ်တွေကို push လုပ်တဲ့အချိန်တိုင်း everytime code got pushed.
on: [push, pull_request]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ၁။ GitHub ပေါ်က ကုဒ်တွေကို ဆွဲယူခြင်း pulling codes from github
    - name: Checkout code
      uses: actions/checkout@v4

    # ၂။ Python စနစ်ကို Pipeline ထဲ ထည့်သွင်းခြင်း setting up python into the pipeline
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ၃။ လိုအပ်တဲ့ စာရွက်စာတမ်း (Dependencies) တွေ သွင်းခြင်း putting dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ၄။ ကုဒ်တွေရဲ့ ပုံစံ မှန်၊ မမှန် အခြေခံစစ်ဆေးခြင်း (Syntax Check)
    - name: Lint with Python syntax check
      run: |
        python -m py_compile app.py
